[constants]
toolchain = '@GLOBAL_SOURCE_ROOT@' / 'tools' / 'metroskrew' / 'bin'

[binaries]
c       = 'gcc'
cpp     = 'g++'
ar      = 'ar'
nm      = 'nm'
strip   = 'strip'
windres = 'windres'
# Data files under files/ are still assembled with mwasmarm, exactly like the ROM build.
nasm    = [toolchain / 'mwasmarm.exe',  '-wrap:sdk', '2.0/sp2p2']

[host_machine]
system      = 'windows'
cpu_family  = 'x86_64'
cpu         = 'x86_64'
endian      = 'little'
